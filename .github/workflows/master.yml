on:
  push:
    branches:
      - master
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ftp.rabbee.com
        username: ${{ secrets.TBS_FTP_USERNAME }}
        password: ${{ secrets.TBS_FTP_PASSWORD }}
        server-dir: /tbs.rabbee.com/
